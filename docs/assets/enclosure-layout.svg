<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">非金属项目盒布局示意</title>
  <desc id="desc">俯视图中，雷达天线朝房间，控制板 USB-C 朝出线侧，线头留出弯折空间。侧视图中，板背面与盒底间有绝缘固定材料。示意不按比例，不是开孔加工图。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#42654e"/></marker></defs>
  <rect width="1100" height="620" rx="20" fill="#f7faf8"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" fill="#20372a">
    <text x="42" y="58" font-size="29" font-weight="700">非金属项目盒 · 布局示意</text>
    <text x="42" y="89" font-size="17" fill="#60776a">不按比例 · 尺寸、开孔与线材弯折均以实物测量为准</text>
    <text x="62" y="143" font-size="20" font-weight="700">俯视：打开盒盖</text>
    <rect x="62" y="164" width="574" height="235" rx="15" fill="#fff" stroke="#607b69" stroke-width="3"/>
    <rect x="95" y="185" width="210" height="49" rx="6" fill="#dcebe0" stroke="#42654e" stroke-width="2"/>
    <text x="200" y="215" text-anchor="middle" font-size="18" font-weight="700">LD2410C 雷达</text>
    <path d="M104 185h192" stroke="#42654e" stroke-width="5"/>
    <path d="M220 177v-43" stroke="#42654e" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="235" y="155" font-size="16">天线面朝房间</text>
    <rect x="375" y="275" width="140" height="74" rx="8" fill="#e9f2eb" stroke="#42654e" stroke-width="2"/>
    <text x="445" y="303" text-anchor="middle" font-size="17" font-weight="700">ESP32-C3</text>
    <text x="445" y="326" text-anchor="middle" font-size="15">Zero-M</text>
    <rect x="508" y="300" width="13" height="21" rx="3" fill="#c7d9cc" stroke="#42654e"/>
    <path d="M521 310h115" stroke="#42654e" stroke-width="5" stroke-linecap="round"/>
    <path d="M632 292v36" stroke="#fff" stroke-width="9"/>
    <text x="548" y="365" font-size="15">USB-C / 出线槽</text>
    <path d="M285 237 C335 244 323 292 371 294 M276 238 C325 254 316 304 371 303 M267 238 C310 261 312 316 371 313 M258 238 C300 270 306 327 371 322" fill="none" stroke="#799b84" stroke-width="2"/>
    <text x="108" y="341" font-size="16" fill="#60776a">四根杜邦线自然弯曲</text>
    <text x="108" y="365" font-size="16" fill="#60776a">针脚以板上丝印为准</text>
    <text x="685" y="143" font-size="20" font-weight="700">侧视：绝缘固定</text>
    <path d="M685 197v168h345V197" fill="#fff" stroke="#607b69" stroke-width="3"/>
    <path d="M685 197h345" stroke="#607b69" stroke-width="3" stroke-dasharray="7 5"/>
    <rect x="727" y="296" width="107" height="13" rx="3" fill="#dcebe0" stroke="#42654e" stroke-width="2"/>
    <rect x="878" y="285" width="104" height="18" rx="3" fill="#e9f2eb" stroke="#42654e" stroke-width="2"/>
    <rect x="738" y="322" width="85" height="13" rx="4" fill="#d8e3db"/>
    <rect x="888" y="318" width="85" height="13" rx="4" fill="#d8e3db"/>
    <text x="780" y="279" text-anchor="middle" font-size="15">雷达</text>
    <text x="930" y="269" text-anchor="middle" font-size="15">控制板</text>
    <path d="M858 338v30" stroke="#42654e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="858" y="398" text-anchor="middle" font-size="16">绝缘垫 / 塑料固定件</text>
    <rect x="62" y="443" width="968" height="120" rx="12" fill="#edf4ee"/>
    <text x="84" y="478" font-size="18" font-weight="700">装配检查</text>
    <text x="84" y="507" font-size="16">天线前方不放金属或厚杂物；板背与针脚绝缘；USB 插头可插拔且线槽无毛刺。</text>
    <text x="84" y="534" font-size="16">盒盖合上后重新验证覆盖范围。示意图不是可直接加工、打印的尺寸图。</text>
  </g>
</svg>
